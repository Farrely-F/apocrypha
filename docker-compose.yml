# Self-hosting Apocrypha. Copy .env.example to .env, fill it in, then: docker compose up -d
# The database is a single SQLite (libSQL) file on the named volume below. Back it up (docs/SELF-HOSTING.md).
services:
  apocrypha:
    build:
      context: .
      args:
        # Baked into canonical, Open Graph and sitemap URLs of the landing page.
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    image: apocrypha:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      DATABASE_URL: file:/data/apocrypha.db
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
    volumes:
      - apocrypha-data:/data

volumes:
  apocrypha-data:
